# version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - '5000:5000'
      - '5555:5555'
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
    env_file:
      - ./backend/.env

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lite
      POSTGRES_DB: excelmind
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

volumes:
  pgdata:
